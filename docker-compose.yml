version: '3'
services:
  timelock-web:
    build: .
    restart: unless-stopped
    ports:
      # Traefik（host.docker.internal＝172.17.0.1）とサーバー自身からだけ受ける。
      # 0.0.0.0 だと Traefik を通らずに外から直接届く（2026-10-22）
      - "127.0.0.1:8404:80"
      - "172.17.0.1:8404:80"
    depends_on:
      - timevault-api
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  timevault-api:
    build: ./api
    restart: unless-stopped
    volumes:
      - vault-data:/data/uploads
    environment:
      - DATA_DIR=/data/uploads

volumes:
  vault-data:
